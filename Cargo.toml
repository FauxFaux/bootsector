[package]
authors = ["Chris West (Faux) <git@goeswhere.com>"]
categories = [
    "filesystem",
    "os",
    "parsing",
]
description = "Read partitions from block devices or files"
license = "MIT"
name = "bootsector"
readme = "README.md"
repository = "https://github.com/FauxFaux/bootsector"
version = "0.2.0"

edition = "2024"

[features]
default = ["std"]
std = ["snafu/std", "positioned-io2"]

[dependencies]
crc = "3"
positioned-io2 = { version = "0.3", optional = true }
snafu = { version ="0.8.9", default-features = false }
